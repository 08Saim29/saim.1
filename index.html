<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<style>
:root{
  --bg:#04060f; --panel:#0b1024ee; --panel2:#0e1530;
  --cyan:#4df3ff; --mag:#ff3ec8; --gold:#ffd166; --green:#5dffb0;
  --txt:#e8f0ff; --dim:#8391b8;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow-x:hidden; min-height:100%;}
canvas#stars{position:fixed; inset:0; z-index:0;}
.wrap{position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:22px 16px 60px;}

/* ---- AUTH SCREEN ---- */
#authScreen{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%, #101a3d, #04060f 70%); padding:20px;}
.authBox{background:linear-gradient(160deg,var(--panel),#0a0f22); border:1px solid #2a3568; border-radius:20px;
  padding:32px 28px; width:100%; max-width:360px; text-align:center; box-shadow:0 0 60px -10px var(--cyan);}
.authBox .ship{width:60px;}
.authBox h1{font-size:1.4rem; letter-spacing:2px; margin:14px 0 4px;
  background:linear-gradient(90deg,var(--cyan),var(--mag)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.authBox p{color:var(--dim); font-size:.8rem; margin-bottom:26px;}
.gbtn{width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; color:#222;
  border:none; padding:12px; border-radius:10px; font-weight:600; font-size:.88rem; cursor:pointer; margin-bottom:12px;}
.gbtn svg{width:18px; height:18px;}
.guestbtn{width:100%; background:#1a2140; color:var(--txt); border:1px solid #3a3560; padding:12px; border-radius:10px;
  font-size:.85rem; cursor:pointer;}
.authErr{color:var(--mag); font-size:.75rem; margin-top:12px; min-height:14px;}

/* ---- NAME PROMPT ---- */
.overlay{position:fixed; inset:0; background:#000a; backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:90; padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--panel2); border:1px solid var(--cyan); border-radius:16px; padding:20px; width:100%; max-width:380px; box-shadow:0 0 40px -6px var(--cyan);}
.modal h3{margin-top:0; letter-spacing:1px;}
.modal input, .modal textarea{width:100%; background:#0a0f22; border:1px solid #2a3568; color:var(--txt); border-radius:8px; padding:9px 10px; font-size:.85rem; margin-bottom:10px; font-family:inherit;}
.modal .row{display:flex; gap:8px;}
.modal .row button{flex:1;}
.cancelbtn{background:#1a2140; color:var(--dim); border:1px solid #2a3568; padding:9px; border-radius:8px; cursor:pointer;}
.addbtn{background:linear-gradient(135deg,var(--cyan),#2b7fff); border:none; color:#001; font-weight:700; padding:9px 16px; border-radius:10px; cursor:pointer; font-size:.78rem; letter-spacing:1px;}

/* ---- APP (hidden until logged in) ---- */
#app{display:none;}
header{display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg,var(--panel),var(--panel2)); border:1px solid #2a3568; border-radius:18px; padding:18px 22px;
  box-shadow:0 0 40px -10px var(--cyan), inset 0 0 30px #00000066;}
.title{display:flex; align-items:center; gap:14px;}
.ship{filter:drop-shadow(0 0 10px var(--cyan)); animation:float 3.2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
h1{margin:0; font-size:1.5rem; letter-spacing:3px; font-weight:800;
  background:linear-gradient(90deg,var(--cyan),var(--mag)); -webkit-background-clip:text; background-clip:text; color:transparent;}
h1 span{display:block; font-size:.62rem; letter-spacing:4px; color:var(--dim); -webkit-text-fill-color:var(--dim);}
.userRow{display:flex; align-items:center; gap:6px; font-size:.68rem; color:var(--dim); margin-top:4px;}
.userRow img{width:18px; height:18px; border-radius:50%;}
.logout{background:none; border:1px solid #3a3560; color:var(--dim); font-size:.6rem; padding:2px 8px; border-radius:10px; cursor:pointer; margin-left:4px;}

.levelbox{display:flex; align-items:center; gap:14px;}
.ring{position:relative; width:74px; height:74px;}
.ring svg{transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:8;}
.ring .bg{stroke:#1c2547;}
.ring .fg{stroke:url(#gradCyan); stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring .lvl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; font-weight:800; font-size:1rem;}
.ring .lvl small{font-size:.55rem; color:var(--dim); font-weight:500;}
.xpwrap{min-width:160px;}
.xpwrap .lbl{font-size:.7rem; color:var(--dim); margin-bottom:4px; letter-spacing:1px;}
.xpbar{height:10px; border-radius:6px; background:#1a2140; overflow:hidden; border:1px solid #2a3568;}
.xpfill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); box-shadow:0 0 12px var(--cyan); transition:width .6s ease; width:0%;}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:20px 0;}
.stat{background:var(--panel); border:1px solid #253064; border-radius:14px; padding:14px 16px; text-align:center; box-shadow:0 8px 20px -10px #000; transition:transform .3s;}
.stat:hover{transform:translateY(-4px) rotateX(6deg);}
.stat .num{font-size:1.6rem; font-weight:800; color:var(--cyan); text-shadow:0 0 12px currentColor;}
.stat .lab{font-size:.65rem; color:var(--dim); letter-spacing:1.5px; margin-top:2px;}

.sec{display:flex; align-items:center; justify-content:space-between; margin:30px 0 14px;}
.sec h2{font-size:1rem; letter-spacing:3px; color:var(--txt); margin:0; display:flex; gap:8px; align-items:center;}
.sec h2::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--mag); box-shadow:0 0 10px var(--mag);}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.card{background:linear-gradient(160deg,var(--panel),#0a0f22); border:1px solid #253064; border-radius:16px; padding:16px;
  transform-style:preserve-3d; transition:transform .35s ease, box-shadow .35s ease; position:relative; overflow:hidden;}
.card::before{content:''; position:absolute; top:-40%; left:-20%; width:140%; height:140%;
  background:radial-gradient(circle at 30% 20%, #ffffff12, transparent 60%); pointer-events:none;}
.card:hover{transform:rotateY(6deg) rotateX(-4deg) translateY(-6px); box-shadow:0 20px 40px -12px #000, 0 0 30px -8px var(--cyan);}
.card h3{margin:0 0 6px; font-size:1rem;}
.badge{display:inline-block; font-size:.6rem; letter-spacing:1px; padding:2px 8px; border-radius:20px; background:#1a2140; color:var(--gold); border:1px solid #3a3560; margin-bottom:10px;}
.crow{display:flex; gap:14px; align-items:center;}
.cring{width:56px; height:56px; flex:none;}
.cring svg{transform:rotate(-90deg);}
.cring circle{fill:none; stroke-width:6;}
.cring .bg{stroke:#1c2547;}
.cring .fg{stroke:var(--green); stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
.objs{flex:1; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
.objs li{display:flex; align-items:center; gap:8px; font-size:.78rem; cursor:pointer; color:var(--dim);}
.objs li.done{color:var(--txt); text-decoration:line-through; opacity:.6;}
.chk{width:16px; height:16px; border-radius:4px; border:1px solid var(--cyan); flex:none; display:flex; align-items:center; justify-content:center; font-size:.6rem;}
.objs li.done .chk{background:var(--cyan); color:#001;}
.delmis{position:absolute; top:10px; right:10px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:.9rem;}
.delmis:hover{color:var(--mag);}
.empty{color:var(--dim); font-size:.85rem; padding:20px; text-align:center; border:1px dashed #2a3568; border-radius:12px;}

.sysgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
.sys{background:var(--panel); border:1px solid #253064; border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px;}
.sysname{font-size:.85rem; font-weight:600;}
.streak{font-size:.68rem; color:var(--gold);}
.fireBtn{align-self:flex-start; background:#1a2140; border:1px solid #3a3560; color:var(--txt); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.72rem;}
.fireBtn.hit{background:linear-gradient(135deg,var(--gold),#ff9a3c); color:#301; border:none;}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- ============ LOGIN SCREEN ============ -->
<div id="authScreen">
  <div class="authBox">
    <svg class="ship" viewBox="0 0 64 64"><path fill="#4df3ff" d="M32 2c8 8 10 20 10 30 0 6-3 10-3 10l-4 4-6-6 4-4s3-4 3-10c0-6-2-14-4-24zM20 46l-6 6 4 4 6-6zm24 0l6 6-4 4-6-6z"/><circle cx="32" cy="24" r="5" fill="#001"/></svg>
    <h1>MISSION CONTROL</h1>
    <p>Sign in to launch your personal command deck</p>
    <button class="gbtn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.9 0 6.6 1.7 8.1 3.1l6-5.9C34.9 3.2 30 1 24 1 14.8 1 6.9 6.4 3.1 14.1l7 5.4C11.9 13.9 17.4 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.4-4.7 7.1l7.2 5.6c4.2-3.9 6.6-9.6 6.6-17.2z"/><path fill="#FBBC05" d="M10.1 28.5c-.5-1.4-.8-3-.8-4.5s.3-3.1.8-4.5l-7-5.4C1.5 17.3 0.5 20.5 0.5 24s1 6.7 2.6 9.9l7-5.4z"/><path fill="#34A853" d="M24 47c6 0 11-2 14.7-5.3l-7.2-5.6c-2 1.4-4.6 2.2-7.5 2.2-6.6 0-12.1-4.4-14.1-10.4l-7 5.4C6.9 41.6 14.8 47 24 47z"/></svg>
      Sign in with Google
    </button>
    <button class="guestbtn" id="guestBtn">Continue as Guest</button>
    <div class="authErr" id="authErr"></div>
  </div>
</div>

<!-- ============ NAME PROMPT ============ -->
<div class="overlay" id="nameOverlay">
  <div class="modal">
    <h3>👋 What should we call you?</h3>
    <input id="nameInput" placeholder="Your name" maxlength="24">
    <div class="row">
      <button class="addbtn" style="flex:1" onclick="submitName()">Continue</button>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app">
<div class="wrap">
  <header>
    <div class="title">
      <svg class="ship" width="54" height="54" viewBox="0 0 64 64"><path fill="#4df3ff" d="M32 2c8 8 10 20 10 30 0 6-3 10-3 10l-4 4-6-6 4-4s3-4 3-10c0-6-2-14-4-24zM20 46l-6 6 4 4 6-6zm24 0l6 6-4 4-6-6z"/><circle cx="32" cy="24" r="5" fill="#001"/></svg>
      <div>
        <h1>MISSION CONTROL<span>PERSONAL COMMAND DECK</span></h1>
        <div class="userRow"><img id="userAvatar" src="" alt=""><span id="userNameLabel"></span><button class="logout" id="logoutBtn">Sign out</button></div>
      </div>
    </div>
    <div class="levelbox">
      <div class="ring">
        <svg width="74" height="74">
          <defs><linearGradient id="gradCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4df3ff"/><stop offset="100%" stop-color="#ff3ec8"/></linearGradient></defs>
          <circle class="bg" cx="37" cy="37" r="30"></circle>
          <circle class="fg" id="lvlRing" cx="37" cy="37" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"></circle>
        </svg>
        <div class="lvl"><span id="lvlNum">1</span><small>LVL</small></div>
      </div>
      <div class="xpwrap">
        <div class="lbl">XP <span id="xpText">0 / 100</span></div>
        <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statMissions">0</div><div class="lab">ACTIVE MISSIONS</div></div>
    <div class="stat"><div class="num" id="statObjectives">0</div><div class="lab">OBJECTIVES DONE</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lab">BEST STREAK 🔥</div></div>
    <div class="stat"><div class="num" id="statXP">0</div><div class="lab">TOTAL XP</div></div>
  </div>

  <div class="sec"><h2>ACTIVE MISSIONS</h2><button class="addbtn" onclick="openMissionModal()">+ NEW MISSION</button></div>
  <div class="grid" id="missionGrid"></div>

  <div class="sec"><h2>SHIP SYSTEMS (HABITS)</h2><button class="addbtn" onclick="openSysModal()">+ NEW SYSTEM</button></div>
  <div class="sysgrid" id="sysGrid"></div>
</div>
</div>

<div class="overlay" id="missionOverlay">
  <div class="modal">
    <h3>🚀 New Mission</h3>
    <input id="mName" placeholder="Mission name (e.g. Launch Portfolio Site)">
    <textarea id="mObjs" rows="4" placeholder="Objectives, one per line"></textarea>
    <div class="row">
      <button class="cancelbtn" onclick="closeModal('missionOverlay')">Cancel</button>
      <button class="addbtn" style="flex:1" onclick="createMission()">Launch</button>
    </div>
  </div>
</div>

<div class="overlay" id="sysOverlay">
  <div class="modal">
    <h3>⚙️ New System</h3>
    <input id="sName" placeholder="Habit name (e.g. Morning Workout)">
    <div class="row">
      <button class="cancelbtn" onclick="closeModal('sysOverlay')">Cancel</button>
      <button class="addbtn" style="flex:1" onclick="createSystem()">Activate</button>
    </div>
  </div>
</div>

<!-- ============ FIREBASE ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
      Firebase Console -> Project settings -> General -> Your apps -> SDK setup
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCRq6AAYjpdz15lqyaPslP0-ISZaOPx3u0",
  authDomain: "mission-contro-49c2f.firebaseapp.com",
  projectId: "mission-contro-49c2f",
  storageBucket: "mission-contro-49c2f.firebasestorage.app",
  messagingSenderId: "994633330796",
  appId: "1:994633330796:web:552d31ec7558eb873ae849"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbase = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

let currentUser = null;
let state = { missions: [], systems: [], xp: 0, name: "" };
let unsubDoc = null;
let saveTimer = null;

/* ---------- Auth wiring ---------- */
document.getElementById('googleBtn').onclick = async () => {
  document.getElementById('authErr').textContent = '';
  try { await signInWithPopup(auth, provider); }
  catch (e) { document.getElementById('authErr').textContent = e.message; }
};
document.getElementById('guestBtn').onclick = async () => {
  document.getElementById('authErr').textContent = '';
  try { await signInAnonymously(auth); }
  catch (e) { document.getElementById('authErr').textContent = e.message; }
};
document.getElementById('logoutBtn').onclick = async () => {
  if (unsubDoc) unsubDoc();
  await signOut(auth);
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { currentUser = null; return; }
  currentUser = user;
  const ref = doc(dbase, 'users', user.uid);
  const snap = await getDoc(ref);

  if (snap.exists() && snap.data().name) {
    state = Object.assign({ missions: [], systems: [], xp: 0 }, snap.data());
    enterApp();
  } else {
    // brand new user -> ask for a display name
    // IMPORTANT: hide the auth screen first — it has a higher z-index than
    // the name overlay, so without this the prompt renders invisibly behind it.
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('nameInput').value = user.displayName || '';
    document.getElementById('nameOverlay').classList.add('show');
  }
});

window.submitName = async function () {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  state.name = name;
  const ref = doc(dbase, 'users', currentUser.uid);
  await setDoc(ref, state, { merge: true });
  document.getElementById('nameOverlay').classList.remove('show');
  enterApp();
};

function enterApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userNameLabel').textContent = state.name || 'Commander';
  document.getElementById('userAvatar').src = currentUser.photoURL ||
    'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" rx="10" fill="%234df3ff"/></svg>`);

  // live sync: any change to this user's doc (any device/tab) updates the UI
  const ref = doc(dbase, 'users', currentUser.uid);
  if (unsubDoc) unsubDoc();
  unsubDoc = onSnapshot(ref, (snap) => {
    if (snap.exists()) {
      state = Object.assign({ missions: [], systems: [], xp: 0 }, snap.data());
      render();
    }
  });
}

function save() {
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ref = doc(dbase, 'users', currentUser.uid);
    setDoc(ref, state, { merge: false }).catch(console.error);
  }, 400);
}

/* ---------- Starfield ---------- */
const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
let stars = [];
function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({ length: 180 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.4 + .2, s: Math.random() * .5 + .1 }));
}
resize(); addEventListener('resize', resize);
function drawStars() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#4df3ff';
  for (const st of stars) {
    ctx.globalAlpha = .4 + Math.sin(Date.now() * .001 * st.s + st.x) * .4;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; requestAnimationFrame(drawStars);
}
drawStars();

/* ---------- XP / Level ---------- */
const XP_PER_LEVEL = 100;
function xpForLevel(lvl) { return lvl * XP_PER_LEVEL; }
function levelFromXP(xp) {
  let lvl = 1, rem = xp;
  while (rem >= xpForLevel(lvl)) { rem -= xpForLevel(lvl); lvl++; }
  return { lvl, rem, need: xpForLevel(lvl) };
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function render() {
  const { lvl, rem, need } = levelFromXP(state.xp || 0);
  document.getElementById('lvlNum').textContent = lvl;
  document.getElementById('xpText').textContent = `${rem} / ${need}`;
  const circ = 188.5, pct = rem / need;
  document.getElementById('lvlRing').style.strokeDashoffset = circ - circ * pct;
  document.getElementById('xpFill').style.width = (pct * 100) + '%';
  document.getElementById('statXP').textContent = state.xp || 0;
  document.getElementById('userNameLabel').textContent = state.name || 'Commander';

  let doneObjs = 0, bestStreak = 0;
  const grid = document.getElementById('missionGrid'); grid.innerHTML = '';
  const missions = state.missions || [];
  if (missions.length === 0) { grid.innerHTML = '<div class="empty">No active missions. Launch one above 🚀</div>'; }
  missions.forEach((m, mi) => {
    const total = m.objs.length, done = m.objs.filter(o => o.done).length;
    doneObjs += done;
    const pct2 = total ? done / total : 0, circ2 = 131.9;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `
      <button class="delmis" onclick="delMission(${mi})">✕</button>
      <span class="badge">MISSION-${String(mi + 1).padStart(2, '0')}</span>
      <h3>${escapeHtml(m.name)}</h3>
      <div class="crow">
        <div class="cring"><svg width="56" height="56">
          <circle class="bg" cx="28" cy="28" r="21"></circle>
          <circle class="fg" cx="28" cy="28" r="21" stroke-dasharray="${circ2}" stroke-dashoffset="${circ2 - circ2 * pct2}"></circle>
        </svg></div>
        <ul class="objs">${m.objs.map((o, oi) => `<li class="${o.done ? 'done' : ''}" onclick="toggleObj(${mi},${oi})"><span class="chk">${o.done ? '✓' : ''}</span>${escapeHtml(o.text)}</li>`).join('') || '<li style="opacity:.5">No objectives</li>'}</ul>
      </div>`;
    grid.appendChild(card);
  });
  document.getElementById('statMissions').textContent = missions.length;
  document.getElementById('statObjectives').textContent = doneObjs;

  const sg = document.getElementById('sysGrid'); sg.innerHTML = '';
  const systems = state.systems || [];
  systems.forEach((s, si) => {
    bestStreak = Math.max(bestStreak, s.streak || 0);
    const hitToday = s.lastHit === todayStr();
    const el = document.createElement('div'); el.className = 'sys';
    el.innerHTML = `<div class="sysname">${escapeHtml(s.name)}</div>
      <div class="streak">🔥 ${s.streak || 0} day streak</div>
      <button class="fireBtn ${hitToday ? 'hit' : ''}" onclick="hitSystem(${si})">${hitToday ? '✓ Done Today' : 'Mark Today'}</button>`;
    sg.appendChild(el);
  });
  document.getElementById('statStreak').textContent = bestStreak;
}

/* ---------- Actions (exposed on window for inline onclick) ---------- */
window.openMissionModal = () => document.getElementById('missionOverlay').classList.add('show');
window.openSysModal = () => document.getElementById('sysOverlay').classList.add('show');
window.closeModal = (id) => document.getElementById(id).classList.remove('show');

window.createMission = () => {
  const name = document.getElementById('mName').value.trim();
  const objsRaw = document.getElementById('mObjs').value.split('\n').map(t => t.trim()).filter(Boolean);
  if (!name) return;
  state.missions = state.missions || [];
  state.missions.push({ name, objs: objsRaw.map(t => ({ text: t, done: false })) });
  document.getElementById('mName').value = ''; document.getElementById('mObjs').value = '';
  closeModal('missionOverlay'); render(); save();
};
window.delMission = (i) => { state.missions.splice(i, 1); render(); save(); };
window.toggleObj = (mi, oi) => {
  const o = state.missions[mi].objs[oi];
  o.done = !o.done;
  state.xp = (state.xp || 0) + (o.done ? 15 : -15);
  if (state.xp < 0) state.xp = 0;
  render(); save();
};
window.createSystem = () => {
  const name = document.getElementById('sName').value.trim();
  if (!name) return;
  state.systems = state.systems || [];
  state.systems.push({ name, streak: 0, lastHit: null });
  document.getElementById('sName').value = '';
  closeModal('sysOverlay'); render(); save();
};
window.hitSystem = (i) => {
  const s = state.systems[i]; const t = todayStr();
  if (s.lastHit === t) { s.lastHit = null; s.streak = Math.max(0, (s.streak || 0) - 1); state.xp = Math.max(0, (state.xp || 0) - 10); }
  else { s.streak = (s.streak || 0) + 1; s.lastHit = t; state.xp = (state.xp || 0) + 10; }
  render(); save();
};

let lastPointerEvent = null, pointerTicking = false;
document.addEventListener('pointermove', e => {
  lastPointerEvent = e;
  if (pointerTicking) return;
  pointerTicking = true;
  requestAnimationFrame(() => {
    const ev = lastPointerEvent;
    document.querySelectorAll('.card').forEach(c => {
      const r = c.getBoundingClientRect();
      if (ev.clientX < r.left - 40 || ev.clientX > r.right + 40 || ev.clientY < r.top - 40 || ev.clientY > r.bottom + 40) {
        c.style.transform = '';
        return;
      }
      const px = (ev.clientX - r.left) / r.width - 0.5, py = (ev.clientY - r.top) / r.height - 0.5;
      c.style.transform = `rotateY(${px * 10}deg) rotateX(${-py * 10}deg) translateY(-4px)`;
    });
    pointerTicking = false;
  });
});
</script>
</body>
